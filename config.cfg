~~~KEYBOEARD&MOUSE~~~

//Crosshair
cl_crosshairalpha "255"
cl_crosshaircolor "1"
cl_crosshaircolor_b "50"
cl_crosshaircolor_r "50"
cl_crosshaircolor_g "250"
cl_crosshairdot "0"
cl_crosshairgap "-1.9"
cl_crosshairsize "1.5"
cl_crosshairstyle "4"
cl_crosshairusealpha "1"
cl_crosshairthickness "0.1"
cl_fixedcrosshairgap "-1"
cl_crosshair_outlinethickness "1"
cl_crosshair_drawoutline "1"

//Analog bindings
bind "X_AXIS" "rightleft"
bind "Y_AXIS" "!forwardback"
bind "MOUSE_X" "yaw"
bind "MOUSE_Y" "pitch"
bind "U_AXIS" "yaw"
bind "R_AXIS" "pitch"

//Movement keys	
bind "W" "+forward" //Move forward
bind "S" "+back" //Move backward (press the key if you keep running after FORWARD-THROW or FORWARD-JUMP-THROW binds)
bind "A" "+left" //Move left (strafe)
bind "D" "+right" //Move rightT (strafe)
bind "SHIFT" "+sprint" //Walk
bind "CTRL" "+duck" //Duck
bind mwheelup +jump; bind mwheeldown +jump; bind space +jump	

//Weapon keys
bind "E" "+use" //Use
bind "MOUSE1" "+attack" //Fire
bind "MOUSE2" "+attack2" //Secondary fire
bind "R" "+reload" //Reload
bind "Q" "+lastinv" //Last weapon used
bind "B" "+buymenu" //Buymenu
bind "G" "drop" //Drop
bind "1" "slot1" //Primary weapon
bind "2" "slot2" //Secondary weapon
bind "3" "slot3; +lookatweapon; -lookatweapon" //Knife
bind "5" "slot5" //Bomb
bind "v" "slot6" //HE grenade
bind "z" "slot7" //Flashbang
bind "c" "slot8" //Smoke
bind "9" "slot9" //Decoy
bind "x" "slot10" //Molotov
bind "T" "+spray_menu" //Graffiti menu

//Communication keys
bind "MOUSE5" "player_ping" //Player ping
bind "MOUSE4" "+voicerecord" //Use microphone
bind "U" "messagemode2" //Team message
bind "Y" "messagemode" //Chat message
bind "P" "callvote starttimeout" //Call timeout
bind f +lookatweapon

//UI keys
bind "TAB" "+showscores" //Scoreboard
bind "M" "teammenu" //Choose team
bind "`" "toggleconsole" //Toggle console
bind "ESCAPE" "cancelselect" //Cancel select
bind "HOME" "disconnect; exec autoexec" //Disconnect (this key resets all practice bind to your ones)

//declare crosshairs
alias active "cl_crosshaircolor_r 250; cl_crosshair_recoil true"
alias passive "cl_crosshaircolor_r 50; cl_crosshair_recoil false"

//roll through your options
alias xhair "xhair1";
alias xhair1 "active; alias xhair xhair2"
alias xhair2 "passive; alias xhair xhair1"

//bind
bind "L" "xhair"

bind T "yaw -3272.72727 1 1"

-freq 240 cl_bob_lower_amt "21";
cl_bobamt_lat "0.400000";
cl_bobamt_vert "0.250000";
cl_bobcycle "0.98";
cl_viewmodel_shift_left_amt "1.5";
cl_viewmodel_shift_right_amt "0.75";
viewmodel_fov "68.000000";
viewmodel_offset_x "2";
viewmodel_offset_y "2";
viewmodel_offset_z "-2";
viewmodel_presetpos "0.5";
sensitivity 2.5
~~~ALIASES~~~
//Fast drop bomb
alias "+dropbomb" "slot5"
alias "-dropbomb" "drop; nade_mode_false"
bind "J" "+dropbomb"

//Music
snd_deathcamera_volume 0
snd_mapobjective_volume 0 // The bomb music played prior to the ten-second warning
snd_menumusic_volume 0
snd_roundend_volume 0
snd_roundstart_volume 0
snd_tensecondwarning_volume .7
volume 0.2
fps_max 999

//Telemetry
cl_hud_telemetry_frametime_show 2
cl_hud_telemetry_net_misdelivery_show 2
cl_hud_telemetry_ping_show 2

//Buymenu method as HOLD
alias "+buymenu" "buymenu"
alias "-buymenu" "buymenu"

//Fast switchin after AWP shot
alias "+lastinv" "slot3"
alias "-lastinv" "slot1"